<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบดูคะแนนปฏิบัติการ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a56a0;
    --primary-dark: #134080;
    --primary-light: #e8f0fb;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-400: #9ca3af;
    --gray-600: #4b5563;
    --gray-800: #1f2937;
    --shadow: 0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--gray-100);
    color: var(--gray-800);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── Header ─── */
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-md);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-brand { font-size: 1.1rem; font-weight: 700; letter-spacing: .3px; }
  .header-sub  { font-size: .78rem; opacity: .8; margin-top: 1px; }
  .header-user { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 700;
  }
  #headerName { font-size: .9rem; font-weight: 500; }
  #btnLogout {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    color: #fff;
    padding: 5px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Sarabun', sans-serif;
    font-size: .85rem;
    transition: background .2s;
  }
  #btnLogout:hover { background: rgba(255,255,255,.30); }
  header .hidden { display: none; }

  /* ─── Views ─── */
  .view { display: none; }
  .view.active { display: block; }

  /* ─── Login / Change PW card ─── */
  .auth-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 36px 40px;
    width: 100%;
    max-width: 400px;
  }
  .card-logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .card-logo .icon {
    width: 60px; height: 60px;
    background: var(--primary-light);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .card-logo .icon svg { width: 30px; height: 30px; color: var(--primary); }
  .card-logo h1 { font-size: 1.25rem; font-weight: 700; color: var(--gray-800); }
  .card-logo p  { font-size: .88rem; color: var(--gray-600); margin-top: 4px; }

  label { display: block; font-size: .88rem; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; }
  .form-group { margin-bottom: 18px; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--gray-200);
    border-radius: 7px;
    font-family: 'Sarabun', sans-serif;
    font-size: .95rem;
    color: var(--gray-800);
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26,86,160,.12);
  }
  .btn-primary {
    width: 100%;
    padding: 11px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-family: 'Sarabun', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: var(--gray-400); cursor: not-allowed; }
  .alert {
    padding: 10px 14px;
    border-radius: 7px;
    font-size: .88rem;
    margin-bottom: 16px;
  }
  .alert-error   { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
  .alert-success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
  .alert-info    { background: var(--primary-light); color: var(--primary); border: 1px solid #bfdbfe; }
  .hint { font-size: .82rem; color: var(--gray-400); margin-top: 6px; }

  /* ─── Dashboard ─── */
  main {
    flex: 1;
    padding: 28px 24px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .section-title { font-size: 1.05rem; font-weight: 700; color: var(--gray-800); margin-bottom: 14px; }

  /* Subject tabs */
  .module-group { margin-bottom: 20px; }
  .module-label {
    font-size: .78rem;
    font-weight: 700;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 8px;
  }
  .tab-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 8px 18px;
    border-radius: 7px;
    border: 1.5px solid var(--gray-200);
    background: #fff;
    color: var(--gray-600);
    font-family: 'Sarabun', sans-serif;
    font-size: .88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }
  .tab-btn:hover { border-color: var(--primary); color: var(--primary); }
  .tab-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
  }

  /* Student info card */
  .info-card {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 22px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .info-card .icon {
    width: 48px; height: 48px;
    background: var(--primary-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .info-card .icon svg { width: 22px; height: 22px; color: var(--primary); }
  .info-name { font-size: 1.05rem; font-weight: 700; }
  .info-meta { font-size: .85rem; color: var(--gray-600); margin-top: 3px; }

  /* Summary strip */
  .summary-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .summary-box {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    text-align: center;
  }
  .summary-box .val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .summary-box .lbl { font-size: .8rem; color: var(--gray-600); margin-top: 3px; }

  /* Score table */
  .table-wrap {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-x: auto;   /* scroll แนวนอนบน screen แคบ */
    -webkit-overflow-scrolling: touch;
  }
  table { width: 100%; border-collapse: collapse; min-width: 360px; }
  thead { background: var(--primary); color: #fff; }
  thead th {
    padding: 12px 16px;
    text-align: left;
    font-size: .88rem;
    font-weight: 600;
  }
  thead th:last-child { text-align: center; }
  tbody tr { border-bottom: 1px solid var(--gray-100); transition: background .12s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--gray-50); }
  td { padding: 13px 16px; font-size: .92rem; }
  td:last-child { text-align: center; }

  /* Score badge */
  .score-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .score-text { font-size: .95rem; font-weight: 600; }
  .score-pending { color: var(--gray-400); font-size: .88rem; }
  .progress-outer {
    width: 100%; max-width: 120px;
    height: 6px;
    background: var(--gray-200);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-inner {
    height: 100%;
    border-radius: 99px;
    transition: width .4s ease;
  }
  .c-high   { color: var(--success); }
  .c-mid    { color: var(--success); }
  .c-low    { color: var(--success); }
  .bg-high  { background: var(--success); }
  .bg-mid   { background: var(--success); }
  .bg-low   { background: var(--success); }

  .tfoot-row td {
    background: var(--gray-50);
    font-weight: 700;
    font-size: .93rem;
    border-top: 2px solid var(--gray-200);
  }

  /* Group rows */
  .group-header-row td {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
    font-size: .85rem;
    padding: 8px 16px;
    letter-spacing: .3px;
    border-top: 1px solid #c7d9f5;
  }
  .subtotal-row td {
    background: var(--gray-50);
    font-weight: 600;
    font-size: .88rem;
    color: var(--gray-600);
    border-top: 1px dashed var(--gray-200);
  }

  /* Loading spinner */
  .spinner-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 48px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid var(--gray-200);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--gray-400);
    font-size: .95rem;
  }

  /* ─── Responsive ─── */

  /* Tablet (≤768px) */
  @media (max-width: 768px) {
    main { padding: 20px 16px; max-width: 100%; }
    .header-sub { display: none; }
    .summary-strip { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)) !important; }
    .tab-btn { font-size: .82rem; padding: 7px 14px; }
  }

  /* Mobile (≤480px) */
  @media (max-width: 480px) {
    header { padding: 10px 14px; }
    .header-brand { font-size: .95rem; }
    #headerName { display: none; }
    .avatar { width: 30px; height: 30px; font-size: .85rem; }
    #btnLogout { padding: 4px 10px; font-size: .78rem; }

    .auth-wrap { padding: 20px 12px; align-items: flex-start; padding-top: 32px; }
    .card { padding: 24px 18px; }

    main { padding: 16px 12px; }
    .section-title { font-size: .95rem; }
    .module-label { font-size: .72rem; }
    .tab-btn { font-size: .8rem; padding: 6px 12px; }

    .info-card { padding: 14px 16px; gap: 12px; }
    .info-card .icon { width: 38px; height: 38px; }
    .info-name { font-size: .95rem; }
    .info-meta { font-size: .78rem; }

    .summary-strip { grid-template-columns: 1fr 1fr !important; gap: 8px; }
    .summary-box { padding: 12px 10px; }
    .summary-box .val { font-size: 1.2rem; }
    .summary-box .lbl { font-size: .72rem; }

    td { padding: 10px 10px; font-size: .82rem; }
    thead th { padding: 10px 10px; font-size: .8rem; }
  }
</style>
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<header>
  <div>
    <div class="header-brand">ระบบดูคะแนนปฏิบัติการ</div>
    <div class="header-sub">Mechatronics Laboratory Score System</div>
  </div>
  <div class="header-user hidden" id="headerUserArea">
    <div class="avatar" id="headerAvatar">?</div>
    <span id="headerName"></span>
    <button id="btnLogout" onclick="logout()">ออกจากระบบ</button>
  </div>
</header>

<!-- ══════════════ LOGIN VIEW ══════════════ -->
<div id="viewLogin" class="view active">
  <div class="auth-wrap">
    <div class="card">
      <div class="card-logo">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
          </svg>
        </div>
        <h1>เข้าสู่ระบบ</h1>
        <p>ดูคะแนนปฏิบัติการของคุณ</p>
      </div>
      <div id="loginAlert" class="alert alert-error" style="display:none"></div>
      <div class="form-group">
        <label for="inputStudentId">รหัสนักศึกษา</label>
        <input type="text" id="inputStudentId" placeholder="เช่น B6900000" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="inputPassword">รหัสผ่าน</label>
        <input type="password" id="inputPassword" placeholder="รหัสผ่าน" autocomplete="current-password">
        <p class="hint">เข้าใช้งานครั้งแรก: รหัสผ่านเริ่มต้น = รหัสนักศึกษา</p>
      </div>
      <button class="btn-primary" id="btnLogin" onclick="handleLogin()">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- ══════════════ CHANGE PASSWORD VIEW ══════════════ -->
<div id="viewChangePw" class="view">
  <div class="auth-wrap">
    <div class="card">
      <div class="card-logo">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
          </svg>
        </div>
        <h1>ตั้งรหัสผ่านใหม่</h1>
        <p>กรุณาตั้งรหัสผ่านใหม่ก่อนเข้าใช้งานระบบ</p>
      </div>
      <div class="alert alert-info">
        เพื่อความปลอดภัย กรุณาตั้งรหัสผ่านใหม่ที่จำง่ายแต่คาดเดายาก
      </div>
      <div id="changePwAlert" style="display:none" class="alert"></div>
      <div class="form-group">
        <label>รหัสผ่านปัจจุบัน (รหัสนักศึกษา)</label>
        <input type="password" id="cpCurrent" placeholder="รหัสผ่านปัจจุบัน" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>รหัสผ่านใหม่</label>
        <input type="password" id="cpNew" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>ยืนยันรหัสผ่านใหม่</label>
        <input type="password" id="cpConfirm" placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="btnChangePw" onclick="handleChangePw()">บันทึกรหัสผ่าน</button>
    </div>
  </div>
</div>

<!-- ══════════════ DASHBOARD VIEW ══════════════ -->
<div id="viewDashboard" class="view">
  <main>
    <p class="section-title">เลือกรายวิชา</p>
    <div id="moduleGroups"></div>
    <div id="dashContent"></div>
  </main>
</div>

<script>
// ══════════════════════════════════════════════════════
// ⚠️  ตั้งค่า URL ของ Apps Script ที่ deploy แล้ว
// ══════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbwfJhcQ-9UcS4ChylCdsnKctUmt5fx2NqB7kdyO-zC4LFIAwz_bmOEndd28zCYGcsaeRQ/exec';

// ──────────────────────────────────────────────────────
// State
// ──────────────────────────────────────────────────────
const S = {
  studentId: null,
  name: null,
  pwHash: null,       // SHA-256 ของรหัสผ่านปัจจุบัน
  modules: [],        // [{ module, subjects }]
  activeSubject: null
};

// ──────────────────────────────────────────────────────
// Crypto
// ──────────────────────────────────────────────────────
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ──────────────────────────────────────────────────────
// API
// ──────────────────────────────────────────────────────
async function api(params) {
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('เชื่อมต่อ API ไม่สำเร็จ');
  return res.json();
}

// ──────────────────────────────────────────────────────
// Views
// ──────────────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showHeader(show) {
  document.getElementById('headerUserArea').classList.toggle('hidden', !show);
}

// ──────────────────────────────────────────────────────
// Login
// ──────────────────────────────────────────────────────
async function handleLogin() {
  const studentId = document.getElementById('inputStudentId').value.trim();
  const password  = document.getElementById('inputPassword').value;
  const alert_el  = document.getElementById('loginAlert');
  const btn       = document.getElementById('btnLogin');

  if (!studentId || !password) {
    showAlert(alert_el, 'error', 'กรุณากรอกรหัสนักศึกษาและรหัสผ่าน');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังเข้าสู่ระบบ…';
  hideAlert(alert_el);

  try {
    const hash = await sha256(password);
    const res = await api({ action: 'login', student_id: studentId, password_hash: hash });

    if (!res.success) {
      showAlert(alert_el, 'error', res.error);
      return;
    }

    S.studentId = res.student_id;
    S.name      = res.name;
    S.pwHash    = hash;

    setHeaderUser(res.name);

    if (res.first_login) {
      showView('viewChangePw');
    } else {
      await loadDashboard();
    }
  } catch (e) {
    showAlert(alert_el, 'error', 'เกิดข้อผิดพลาด: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
  }
}

// ──────────────────────────────────────────────────────
// Change Password
// ──────────────────────────────────────────────────────
async function handleChangePw() {
  const current  = document.getElementById('cpCurrent').value;
  const newPw    = document.getElementById('cpNew').value;
  const confirm  = document.getElementById('cpConfirm').value;
  const alert_el = document.getElementById('changePwAlert');
  const btn      = document.getElementById('btnChangePw');

  if (!current || !newPw || !confirm) {
    showAlert(alert_el, 'error', 'กรุณากรอกข้อมูลให้ครบ');
    return;
  }
  if (newPw.length < 6) {
    showAlert(alert_el, 'error', 'รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร');
    return;
  }
  if (newPw !== confirm) {
    showAlert(alert_el, 'error', 'รหัสผ่านใหม่ไม่ตรงกัน');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก…';
  hideAlert(alert_el);

  try {
    const currentHash = await sha256(current);
    const newHash     = await sha256(newPw);

    const res = await api({
      action: 'change_password',
      student_id:   S.studentId,
      current_hash: currentHash,
      new_hash:     newHash
    });

    if (!res.success) {
      showAlert(alert_el, 'error', res.error);
      return;
    }

    S.pwHash = newHash;
    showAlert(alert_el, 'success', 'เปลี่ยนรหัสผ่านสำเร็จ! กำลังไปยังหน้าหลัก…');
    setTimeout(loadDashboard, 1200);
  } catch (e) {
    showAlert(alert_el, 'error', 'เกิดข้อผิดพลาด: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'บันทึกรหัสผ่าน';
  }
}

// ──────────────────────────────────────────────────────
// Dashboard
// ──────────────────────────────────────────────────────
async function loadDashboard() {
  showView('viewDashboard');
  showHeader(true);
  renderModuleGroups([]);
  setContent(spinnerHTML());

  try {
    const res = await api({ action: 'get_subjects', student_id: S.studentId, password_hash: S.pwHash });
    if (!res.success) throw new Error(res.error);
    S.modules = res.modules; // [{ module, subjects: [{key, name}] }]
    renderModuleGroups(S.modules);
    const firstSubject = S.modules[0]?.subjects[0];
    if (firstSubject) {
      selectSubject(firstSubject.key);
    } else {
      setContent('<div class="empty-state">ยังไม่มีรายวิชาในระบบ</div>');
    }
  } catch (e) {
    setContent(`<div class="empty-state">ไม่สามารถโหลดข้อมูลได้: ${e.message}</div>`);
  }
}

function renderModuleGroups(modules) {
  const container = document.getElementById('moduleGroups');
  container.innerHTML = modules.map(m => `
    <div class="module-group">
      <div class="module-label">${escHtml(m.module)}</div>
      <div class="tab-list">
        ${m.subjects.map(s =>
          `<button class="tab-btn" id="tab-${s.key}" onclick="selectSubject('${s.key}')">${escHtml(s.name)}</button>`
        ).join('')}
      </div>
    </div>
  `).join('');
}

async function selectSubject(key) {
  S.activeSubject = key;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const tab = document.getElementById(`tab-${key}`);
  if (tab) tab.classList.add('active');
  setContent(spinnerHTML());

  try {
    const res = await api({
      action:        'get_scores',
      student_id:    S.studentId,
      password_hash: S.pwHash,
      subject:       key
    });

    if (!res.success) {
      setContent(`<div class="empty-state">${res.error}</div>`);
      return;
    }

    renderScores(res);
  } catch (e) {
    setContent(`<div class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${e.message}</div>`);
  }
}

function getCategory(name) {
  const n = name.trim().toLowerCase();
  if (n.startsWith('assignment')) return 'Assignment';
  if (n.startsWith('quiz'))       return 'Quiz';
  return 'อื่นๆ';
}

function scoreEl(t) {
  if (t.score === null) return `<span class="score-pending">รอให้คะแนน</span>`;
  const p   = t.max > 0 ? t.score / t.max : 0;
  const cls = p >= 0.8 ? 'high' : p >= 0.5 ? 'mid' : 'low';
  return `<div class="score-wrap">
    <span class="score-text c-${cls}">${t.score} / ${t.max}</span>
    <div class="progress-outer"><div class="progress-inner bg-${cls}" style="width:${Math.round(p*100)}%"></div></div>
  </div>`;
}

function renderScores(data) {
  const { name, group, subject_name, tasks } = data;

  // ── Group tasks by category ──
  const ORDER = ['Assignment', 'Quiz', 'อื่นๆ'];
  const groups = {};
  ORDER.forEach(c => { groups[c] = []; });
  tasks.forEach(t => groups[getCategory(t.name)].push(t));

  // ── Summary boxes per category ──
  const summaryBoxes = ORDER.filter(c => groups[c].length > 0).map(c => {
    const grp     = groups[c];
    const scored  = grp.filter(t => t.score !== null);
    const tot     = scored.reduce((s, t) => s + t.score, 0);
    const totMax  = scored.reduce((s, t) => s + t.max, 0);
    const pct     = totMax > 0 ? Math.round(tot / totMax * 100) : 0;
    const color   = pct >= 80 ? 'var(--success)' : pct >= 50 ? 'var(--success)' : 'var(--success)';
    const display = scored.length > 0 ? `${tot} / ${totMax}` : '–';
    const pctStr  = scored.length > 0 ? `(${pct}%)` : '';
    return `<div class="summary-box">
      <div class="val" style="color:${scored.length>0?color:'var(--gray-400)'}">${display}</div>
      <div class="lbl">คะแนน${c} ${pctStr}</div>
    </div>`;
  }).join('');

  // ── Table body rows grouped ──
  let idx = 0;
  const bodyRows = ORDER.filter(c => groups[c].length > 0).map(c => {
    const grp    = groups[c];
    const scored = grp.filter(t => t.score !== null);
    const tot    = scored.reduce((s, t) => s + t.score, 0);
    const totMax = scored.reduce((s, t) => s + t.max, 0);
    const pct    = totMax > 0 ? Math.round(tot / totMax * 100) : 0;

    const taskRows = grp.map(t => {
      idx++;
      return `<tr>
        <td>${idx}</td>
        <td>${escHtml(t.name)}</td>
        <td style="text-align:center">${t.max}</td>
        <td>${scoreEl(t)}</td>
      </tr>`;
    }).join('');

    const subtotalScore = scored.length > 0
      ? `${tot} / ${totMax} <span style="font-size:.8rem;color:var(--gray-400)">(${pct}%)</span>`
      : `<span style="color:var(--gray-400)">–</span>`;

    return `
      <tr class="group-header-row"><td colspan="4">${c}</td></tr>
      ${taskRows}
      <tr class="subtotal-row">
        <td colspan="2" style="padding-left:24px">รวม${c}</td>
        <td style="text-align:center">${totMax > 0 ? totMax : '–'}</td>
        <td style="text-align:center">${subtotalScore}</td>
      </tr>`;
  }).join('');

  document.getElementById('dashContent').innerHTML = `
    <div class="info-card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <div>
        <div class="info-name">${escHtml(name)}</div>
        <div class="info-meta">รหัส: ${escHtml(data.student_id)} &nbsp;|&nbsp; กลุ่ม: ${escHtml(String(group))} &nbsp;|&nbsp; ${escHtml(subject_name)}</div>
      </div>
    </div>

    <div class="summary-strip">
      ${summaryBoxes}
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>ชื่องาน</th>
            <th style="text-align:center">คะแนนเต็ม</th>
            <th style="text-align:center">คะแนนที่ได้</th>
          </tr>
        </thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
  `;
}

// ──────────────────────────────────────────────────────
// Logout
// ──────────────────────────────────────────────────────
function logout() {
  S.studentId = S.name = S.pwHash = null;
  S.subjects  = [];
  S.activeSubject = null;
  document.getElementById('inputStudentId').value = '';
  document.getElementById('inputPassword').value = '';
  hideAlert(document.getElementById('loginAlert'));
  showHeader(false);
  showView('viewLogin');
}

// ──────────────────────────────────────────────────────
// Helpers
// ──────────────────────────────────────────────────────
function setContent(html) {
  document.getElementById('dashContent').innerHTML = html;
}
function spinnerHTML() {
  return '<div class="spinner-wrap"><div class="spinner"></div></div>';
}
function showAlert(el, type, msg) {
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAlert(el) { el.style.display = 'none'; }
function setHeaderUser(name) {
  document.getElementById('headerName').textContent = name;
  document.getElementById('headerAvatar').textContent = name.charAt(0);
}
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Allow Enter key on login form
document.getElementById('inputPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});
document.getElementById('inputStudentId').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('inputPassword').focus();
});
</script>
